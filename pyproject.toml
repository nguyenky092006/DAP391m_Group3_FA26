[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-fedorion"
version = "0.1.0"
description = "Leakage-aware paired-view federated learning for Vietnamese speech emotion recognition"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DAP391m PVC-FedOrion team" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pvc-fedorion-manifest = "pvc_fedorion.data.manifest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

